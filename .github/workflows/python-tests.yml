name: Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip

      - run: python -m pip install -r requirements-dev.txt

      - run: python -m pip check

      - run: python -m compileall -q .

      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js

      - name: Check Advanced Math Studio JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("frontend/studio.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.IGNORECASE | re.DOTALL)
          inline_scripts = [script for script in scripts if script.strip()]
          if len(inline_scripts) != 1:
              raise SystemExit(f"Expected one inline Studio script, found {len(inline_scripts)}")
          Path("/tmp/studio-inline.js").write_text(inline_scripts[0], encoding="utf-8")
          PY
          node --check /tmp/studio-inline.js

      - run: python -m pytest -q
